{% extends "base.html" %}
{% block content %}
  <div class="card">
    <h2 style="margin-top: 0;">Клиенты</h2>
    <form method="get" action="/admin/clients" class="row" style="margin-bottom: 12px;">
      <div>
        <label>Поиск</label>
        <input name="q" value="{{ q or '' }}" placeholder="имя или контакт" />
      </div>
      <div style="align-self:end;">
        <button type="submit">Найти</button>
      </div>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Имя</th>
          <th>Контакт</th>
          <th>Посещений</th>
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
          <tr>
            <td>{{ row.id }}</td>
            <td>
              {{ row.name }}
              {% if not row.is_confirmed %}
                <span class="muted" title="Ждёт подтверждения администратора">· черновик</span>
              {% endif %}
            </td>
            <td>{{ row.contact_preview or "—" }}</td>
            <td>{{ row.visits_count }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
