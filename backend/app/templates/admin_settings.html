{% extends "base.html" %}
{% block content %}
  <div class="card" style="max-width: 680px;">
    <h2 style="margin-top: 0;">Настройки</h2>
    <p class="muted">Процент салона применяется только к новым визитам (в визите хранится снимок).</p>

    {% if saved %}
      <div class="card" style="border-color:#bbf7d0; background:#f0fdf4;">
        Сохранено.
      </div>
    {% endif %}

    <form method="post" action="/admin/settings">
      <div style="margin-bottom: 12px;">
        <label>Процент салона (0..1)</label>
        <input name="salon_cut_pct" value="{{ salon_cut_pct }}" />
      </div>
      <button type="submit">Сохранить</button>
    </form>
  </div>
{% endblock %}
