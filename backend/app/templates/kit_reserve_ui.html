  <div id="reserve_overlay" style="display:none;pointer-events:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:50;align-items:center;justify-content:center;padding:16px;" onclick="if(event.target===this) closeReserveModal();">
    <div class="card" style="max-width:480px;width:100%;margin:0;position:relative;" onclick="event.stopPropagation();">
      <h3 style="margin-top:0;">Резерв комплекта <span id="reserve_sku_label"></span></h3>
      <form id="reserve_form" method="post" action="">
        <input type="hidden" name="action" value="set" />
        <input type="hidden" name="after_reserve" value="{{ after_reserve }}" />
        <input type="hidden" name="reserved_for_client_id" id="reserve_client_id" value="" />

        <p id="reserve_stock_hint" class="muted" style="font-size:13px;margin:0 0 12px;"></p>

        <div style="margin-bottom:12px;">
          <div style="font-weight:600;margin-bottom:8px;">Объём резерва *</div>
          <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;">
            <input type="checkbox" name="reserve_full" id="reserve_full_cb" value="1" style="margin-top:4px;" />
            <span>Весь свободный остаток (все доступные сейчас заготовки)</span>
          </label>
          <div id="reserve_qty_block">
            <label>Количество заготовок</label>
            <input type="number" name="reserve_pieces" id="reserve_pieces_inp" min="1" step="1" value="" placeholder="например, 5" />
          </div>
          <p class="muted" style="font-size:12px;margin:8px 0 0;">Нужно выбрать галочку «весь остаток» <strong>или</strong> указать число (не больше свободного остатка).</p>
        </div>

        <div style="margin-bottom:12px;">
          <label>Клиент (необязательно)</label>
          <div id="reserve_client_search_row" style="display:flex;gap:8px;align-items:stretch;margin-top:6px;">
            <input type="search" id="reserve_client_q" autocomplete="off" placeholder="Поиск по имени" value="" style="flex:1;min-width:0;" />
            <button type="button" id="reserve_client_find_btn" class="secondary" onclick="reserveClientSuggest()" style="flex-shrink:0;white-space:nowrap;">Найти</button>
          </div>
          <ul id="reserve_client_list" style="list-style:none;padding:0;margin:8px 0 0;max-height:160px;overflow:auto;"></ul>
          <div id="reserve_client_selected_panel" style="display:none;margin-top:10px;padding:10px 12px;border-radius:8px;border:1px solid #6ee7b7;background:#ecfdf5;font-size:14px;">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between;">
              <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;">
                <span style="font-weight:700;color:#065f46;">Выбран клиент</span>
                <span id="reserve_client_selected_name" style="font-weight:600;color:#047857;"></span>
              </div>
              <button type="button" id="reserve_client_change_btn" class="secondary" style="flex-shrink:0;">Изменить</button>
            </div>
          </div>
        </div>

        <div style="margin-bottom:12px;">
          <label>Сотрудник (необязательно)</label>
          <select name="reserved_for_user_id" id="reserve_user_select">
            <option value="">— не выбран —</option>
            {% for u in staff_users %}
              <option value="{{ u.id }}">{{ u.display_name }} ({% if u.role.value == 'MASTER' %}{{ ru_master_level(u.master_level) }}{% else %}{{ u.role.value }}{% endif %})</option>
            {% endfor %}
          </select>
        </div>

        <p class="muted" style="font-size:12px;">Нужно выбрать хотя бы клиента или сотрудника.</p>

        <div class="row" style="margin-top:16px;">
          <button type="submit">Сохранить резерв</button>
          <button type="button" class="secondary" onclick="closeReserveModal()">Отмена</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
    let reserveTimer = null;
    let reserveFreeAvail = 0;
    let reserveSlotsUsed = 0;
    let reserveMaxSlots = 3;

    function syncReserveQtyDisabled() {
      const cb = document.getElementById('reserve_full_cb');
      const inp = document.getElementById('reserve_pieces_inp');
      const block = document.getElementById('reserve_qty_block');
      if (!cb || !inp || !block) return;
      const full = cb.checked;
      inp.disabled = full;
      block.style.opacity = full ? '0.55' : '1';
      if (full) inp.value = '';
    }

    function syncReserveClientUi() {
      const cidEl = document.getElementById('reserve_client_id');
      const q = document.getElementById('reserve_client_q');
      const findBtn = document.getElementById('reserve_client_find_btn');
      const row = document.getElementById('reserve_client_search_row');
      const panel = document.getElementById('reserve_client_selected_panel');
      const nameEl = document.getElementById('reserve_client_selected_name');
      if (!cidEl || !q || !findBtn || !row || !panel || !nameEl) return;
      const cid = (cidEl.value || '').trim();
      const has = !!cid;
      q.disabled = has;
      findBtn.disabled = has;
      row.style.opacity = has ? '0.55' : '1';
      panel.style.display = has ? 'block' : 'none';
      if (!has) {
        nameEl.textContent = '';
      }
    }

    function openReserveModal(kitId, sku, freeAvail, slotsUsed, maxSlots, preClientId, preUserId, preClientName) {
      reserveFreeAvail = parseInt(String(freeAvail || '0'), 10) || 0;
      reserveSlotsUsed = parseInt(String(slotsUsed || '0'), 10) || 0;
      reserveMaxSlots = parseInt(String(maxSlots || '3'), 10) || 3;
      if (reserveFreeAvail <= 0) {
        alert('Нет свободного остатка для резерва.');
        return;
      }
      if (reserveSlotsUsed >= reserveMaxSlots) {
        alert('Достигнут лимит резервов на этот комплект (' + reserveMaxSlots + '). Сначала снимите резерв.');
        return;
      }
      const overlay = document.getElementById('reserve_overlay');
      overlay.style.display = 'flex';
      overlay.style.pointerEvents = 'auto';
      document.getElementById('reserve_sku_label').textContent = sku;
      document.getElementById('reserve_form').action = '/kits/' + kitId + '/reserve';
      document.getElementById('reserve_client_q').value = '';
      document.getElementById('reserve_client_list').innerHTML = '';
      document.getElementById('reserve_full_cb').checked = false;
      document.getElementById('reserve_pieces_inp').value = '';
      syncReserveQtyDisabled();
      document.getElementById('reserve_stock_hint').textContent =
        'Свободно сейчас: ' + reserveFreeAvail + ' шт. Резервов у комплекта: ' + reserveSlotsUsed + ' / ' + reserveMaxSlots + '.';
      const cid = preClientId != null && preClientId !== '' ? String(preClientId) : '';
      document.getElementById('reserve_client_id').value = cid;
      const nameEl = document.getElementById('reserve_client_selected_name');
      if (preClientName) {
        nameEl.textContent = preClientName;
      } else if (cid) {
        nameEl.textContent = 'id ' + cid;
      } else {
        nameEl.textContent = '';
      }
      const sel = document.getElementById('reserve_user_select');
      sel.value = preUserId != null && preUserId !== '' ? String(preUserId) : '';
      syncReserveClientUi();
      if (!cid) {
        setTimeout(function () { document.getElementById('reserve_client_q').focus(); }, 0);
      }
    }
    function closeReserveModal() {
      const overlay = document.getElementById('reserve_overlay');
      overlay.style.display = 'none';
      overlay.style.pointerEvents = 'none';
    }
    function selectReserveClient(id, name) {
      document.getElementById('reserve_client_id').value = String(id);
      document.getElementById('reserve_client_selected_name').textContent = name;
      document.getElementById('reserve_client_list').innerHTML = '';
      document.getElementById('reserve_client_q').value = '';
      syncReserveClientUi();
    }

    function clearReserveClientSelection() {
      document.getElementById('reserve_client_id').value = '';
      document.getElementById('reserve_client_selected_name').textContent = '';
      document.getElementById('reserve_client_list').innerHTML = '';
      syncReserveClientUi();
      var q = document.getElementById('reserve_client_q');
      q.value = '';
      q.focus();
    }

    async function reserveClientSuggest() {
      const qEl = document.getElementById('reserve_client_q');
      if (qEl.disabled) return;
      const q = qEl.value.trim();
      const res = await fetch('/master/clients/suggest?q=' + encodeURIComponent(q));
      if (!res.ok) return;
      const data = await res.json();
      const ul = document.getElementById('reserve_client_list');
      ul.innerHTML = '';
      for (const c of data.clients || []) {
        const li = document.createElement('li');
        li.style.marginBottom = '6px';
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'secondary';
        b.textContent = c.name + (c.is_draft ? ' (черновик)' : '');
        b.onclick = function () { selectReserveClient(c.id, c.name); };
        li.appendChild(b);
        ul.appendChild(li);
      }
    }
    function scheduleReserveClientSuggest() {
      const qEl = document.getElementById('reserve_client_q');
      if (qEl && qEl.disabled) return;
      clearTimeout(reserveTimer);
      reserveTimer = setTimeout(reserveClientSuggest, 350);
    }
    function bindReserveUi() {
      var chg = document.getElementById('reserve_client_change_btn');
      if (chg) chg.addEventListener('click', clearReserveClientSelection);
      var cb = document.getElementById('reserve_full_cb');
      if (cb) cb.addEventListener('change', syncReserveQtyDisabled);
      document.querySelectorAll('.js-reserve-open').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const kitId = parseInt(btn.getAttribute('data-kit-id') || '0', 10);
          const sku = btn.getAttribute('data-sku') || '';
          const freeAvail = btn.getAttribute('data-free') || '0';
          const slotsUsed = btn.getAttribute('data-slots') || '0';
          const maxSlots = btn.getAttribute('data-max') || '3';
          const rawC = btn.getAttribute('data-client-id') || '';
          const rawU = btn.getAttribute('data-user-id') || '';
          const cname = btn.getAttribute('data-client-name') || '';
          const preC = rawC ? parseInt(rawC, 10) : null;
          const preU = rawU ? parseInt(rawU, 10) : null;
          openReserveModal(kitId, sku, freeAvail, slotsUsed, maxSlots, preC, preU, cname || null);
        });
      });
      document.querySelectorAll('.js-reserve-limit-full').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var t = btn.getAttribute('title');
          alert(t || 'Достигнут лимит резервов на этот комплект.');
        });
      });
      var rcq = document.getElementById('reserve_client_q');
      if (rcq) rcq.addEventListener('input', scheduleReserveClientSuggest);
      var rf = document.getElementById('reserve_form');
      if (rf) {
        rf.addEventListener('submit', function (e) {
          const fa = parseInt(String(reserveFreeAvail || '0'), 10) || 0;
          const su = parseInt(String(reserveSlotsUsed || '0'), 10) || 0;
          const mx = parseInt(String(reserveMaxSlots || '3'), 10) || 3;
          if (fa <= 0) {
            e.preventDefault();
            alert('Нет свободного остатка для резерва.');
            return;
          }
          if (su >= mx) {
            e.preventDefault();
            alert('Достигнут лимит резервов на этот комплект (' + mx + ').');
            return;
          }
          const full = document.getElementById('reserve_full_cb').checked;
          const pq = document.getElementById('reserve_pieces_inp').value.trim();
          if (full && pq) {
            e.preventDefault();
            alert('Выберите либо «весь остаток», либо количество, не оба варианта.');
            return;
          }
          if (!full && !pq) {
            e.preventDefault();
            alert('Отметьте «весь свободный остаток» или введите количество заготовок.');
            return;
          }
          if (!full) {
            const n = parseInt(pq, 10);
            if (!n || n < 1) {
              e.preventDefault();
              alert('Укажите количество не меньше 1.');
              return;
            }
            if (n > fa) {
              e.preventDefault();
              alert('Нельзя зарезервировать больше свободного остатка (' + fa + ').');
              return;
            }
          }
          const cid = document.getElementById('reserve_client_id').value.trim();
          const uid = document.getElementById('reserve_user_select').value.trim();
          if (!cid && !uid) {
            e.preventDefault();
            alert('Выбери клиента и/или сотрудника.');
          }
        });
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bindReserveUi);
    } else {
      bindReserveUi();
    }
  </script>
