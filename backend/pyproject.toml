# Только настройки инструментов. Пакет не собирается и не устанавливается через pip.
# pytest настраивается отдельно в pytest.ini.

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data"]

[tool.ruff.lint]
# Консервативный набор: синтаксические ошибки (E9) и pyflakes (F:
# неиспользуемые импорты/переменные, неопределённые имена, повторы ключей).
# Расширять (I, B, C90, ...) будем позже, отдельными шагами.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# В __init__.py импорты часто служат реэкспортом.
"__init__.py" = ["F401"]
